# Mount a module from a local directory, editable live (changes apply on the
# next request). The module is not installed automatically.
#
# In .env:
#   COMPOSE_FILE=compose.yaml:overrides/module.yaml
#   MODULE_PATH=../my-module   # module source, relative to compose.yaml
#   MODULE_NAME=mymodule       # directory name under modules/ (the module's technical name)
# Then: docker compose run --rm console prestashop:module install "$MODULE_NAME"

x-module: &module ${MODULE_PATH:?Set MODULE_PATH in .env}:/var/www/html/modules/${MODULE_NAME:?Set MODULE_NAME in .env}

services:
  prestashop:
    volumes:
      - *module
  # Caddy serves the module's static files (CSS, JS, images).
  caddy:
    volumes:
      - ${MODULE_PATH}:/var/www/html/modules/${MODULE_NAME}:ro
  setup:
    volumes:
      - *module
  backup:
    volumes:
      - *module
  console:
    volumes:
      - *module
